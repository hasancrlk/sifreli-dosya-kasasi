services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    # No published port: reachable only from the internal network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
      ENCRYPTED_FILES_DIR: /app/encrypted_files
    ports:
      - "127.0.0.1:8000:8000"   # put a TLS reverse proxy in front for public access
    volumes:
      - encrypted_files:/app/encrypted_files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [internal]

volumes:
  postgres_data:
  encrypted_files:

networks:
  internal:
